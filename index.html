<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dora's Music Player</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* Player sticks strictly to top, left, right with zero margin/padding */
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            width: 100vw;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            margin: 0;
            padding: 0;
        }

        @keyframes gradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .player-wrapper {
            width: 100%;
            background: linear-gradient(135deg, var(--c5, #1a1a1a), var(--c2, #0f0f0f), var(--c3, #2a1b3d), var(--c4, #111));
            background-size: 300% 300%;
            animation: gradientAnimation 12s ease infinite;
            animation-play-state: paused; /* Paused by default until playing */
            
            border-radius: 0px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            height: 75px;
            flex-shrink: 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .player-wrapper.playing {
            animation-play-state: running;
        }

        .player-main {
            display: flex;
            align-items: center;
            width: 100%;
            height: calc(100% - 6px);
            padding: 0 12px;
            gap: 10px;
            background: rgba(15, 15, 15, 0.35);
            backdrop-filter: blur(4px);
        }

        /* Left side YouTube Link Thumbnail & Info */
        .track-left {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            flex-grow: 1;
            overflow: hidden;
        }

        .yt-link {
            display: flex;
            align-items: center;
            text-decoration: none;
            flex-shrink: 0;
            position: relative;
            width: 44px;
            height: 33px;
            border-radius: 4px;
            overflow: hidden;
            background: #222;
        }

        .yt-link img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .yt-link::after {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.2);
            transition: background 0.2s;
        }

        .yt-link:hover::after {
            background: rgba(0, 0, 0, 0);
        }

        .track-info {
            display: flex;
            flex-direction: column;
            min-width: 0;
            flex-grow: 1;
            overflow: hidden;
        }

        .brand-title {
            font-size: 10px;
            font-weight: 600;
            color: var(--c1, #ff3385);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 1px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }

        /* Marquee Container with Left-Only Seamless Loop */
        .marquee-container {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
            display: flex;
        }

        .track-title-wrapper {
            display: inline-flex;
            white-space: nowrap;
            will-change: transform;
            animation: scrollLeft 10s linear infinite;
        }

        .track-title {
            font-size: 12px;
            font-weight: 500;
            color: #f1f1f1;
            text-decoration: none;
            display: inline-block;
            padding-right: 40px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
        }

        .track-title:hover {
            text-decoration: underline;
        }

        @keyframes scrollLeft {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .track-time {
            font-size: 10px;
            color: #ccc;
            margin-top: 1px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }

        /* Controls */
        .controls {
            display: flex;
            align-items: center;
            gap: 2px;
            flex-shrink: 0;
        }

        button.control-btn {
            background: none;
            border: none;
            cursor: pointer;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            outline: none;
        }

        button.control-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        button.control-btn svg {
            width: 15px;
            height: 15px;
            fill: #ddd;
            transition: fill 0.2s;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.8));
        }

        button.control-btn:hover svg {
            fill: #fff;
        }

        button.control-btn.active svg {
            fill: var(--c1, #ff3385);
            filter: drop-shadow(0 0 6px var(--c1));
        }

        button.control-btn.primary svg {
            width: 17px;
            height: 17px;
            fill: var(--c1, #ff3385);
            filter: drop-shadow(0 0 6px var(--c1));
        }

        /* Bottom Progress / Seek Bar with All-Sides Glow */
        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: rgba(0, 0, 0, 0.4);
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
            z-index: 2;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--c1, #ff3385);
            width: 0%;
            pointer-events: none;
            transition: background-color 0.3s ease;
            box-shadow: 0 0 10px var(--c1), 0 0 4px var(--c1);
        }

        /* Input & Actions Container */
        .content-container {
            display: none;
            flex-direction: column;
            gap: 12px;
            padding: 16px;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        .input-group {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .input-group input {
            flex-grow: 1;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 10px 14px;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-group input:focus {
            border-color: var(--c1, #ff3385);
            box-shadow: 0 0 6px var(--c1);
        }

        .input-group button {
            background: var(--c1, #ff3385);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 0 18px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
            white-space: nowrap;
        }

        .input-group button:hover {
            opacity: 0.85;
        }

        .action-row {
            display: flex;
            gap: 8px;
        }

        .action-row button {
            background: #1f1f1f;
            color: #fff;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 8px 14px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }

        .action-row button:hover {
            background: #2a2a2a;
            border-color: var(--c1, #ff3385);
        }

        /* History Section */
        .history-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 8px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-label {
            font-size: 11px;
            font-weight: 600;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .clear-history-btn {
            background: none;
            border: none;
            color: #ff4444;
            font-size: 11px;
            cursor: pointer;
            padding: 2px 4px;
            transition: opacity 0.2s;
        }

        .clear-history-btn:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 150px;
            overflow-y: auto;
        }

        .history-item {
            background: #141414;
            border: 1px solid #222;
            padding: 8px 10px;
            border-radius: 4px;
            font-size: 12px;
            color: #ddd;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
        }

        .history-item:hover {
            background: #1f1f1f;
            border-color: var(--c1, #ff3385);
            color: #fff;
        }

        .history-title-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-grow: 1;
            margin-right: 8px;
        }

        .history-remove-btn {
            background: none;
            border: none;
            color: #777;
            font-size: 14px;
            cursor: pointer;
            padding: 0 4px;
            line-height: 1;
            transition: color 0.2s;
        }

        .history-remove-btn:hover {
            color: #ff4444;
        }

        /* See All / See Less Link Style Button */
        .history-toggle-btn {
            background: none;
            border: none;
            color: var(--c1, #ff3385);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            padding: 2px 0;
            margin-top: 2px;
            width: fit-content;
            transition: opacity 0.2s;
        }

        .history-toggle-btn:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        /* Custom Alert / Embed Modal Overlay Styling */
        #customAlertOverlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 16px;
        }

        .custom-alert-box {
            background: #161616;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 15px var(--c1, #ff3385);
            animation: alertPop 0.2s ease-out;
        }

        @keyframes alertPop {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .custom-alert-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--c1, #ff3385);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .custom-alert-message {
            font-size: 13px;
            color: #ddd;
            margin-bottom: 16px;
            line-height: 1.4;
            word-break: break-word;
        }

        .custom-alert-textarea {
            width: 100%;
            background: #0a0a0a;
            border: 1px solid #282828;
            border-radius: 4px;
            padding: 8px;
            color: #00ffcc;
            font-family: monospace;
            font-size: 11px;
            height: 65px;
            resize: none;
            outline: none;
            margin-bottom: 16px;
        }

        .custom-alert-btn-group {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .custom-alert-btn {
            background: var(--c1, #ff3385);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 8px 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            box-shadow: 0 0 8px var(--c1, #ff3385);
        }

        .custom-alert-btn.secondary {
            background: #222;
            box-shadow: none;
        }

        .custom-alert-btn:hover {
            opacity: 0.85;
        }
    </style>
</head>
<body>

    <!-- Custom Alert / Modal Overlay -->
    <div id="customAlertOverlay">
        <div class="custom-alert-box">
            <div id="modalTitle" class="custom-alert-title">Notice</div>
            <div id="customAlertMessage" class="custom-alert-message">Message here</div>
            <div id="modalExtraContainer"></div>
            <div class="custom-alert-btn-group">
                <button id="customAlertOkBtn" class="custom-alert-btn">OK</button>
            </div>
        </div>
    </div>

    <div class="player-wrapper" id="playerWrapper">
        <div class="player-main">
            <!-- Left: YouTube Link & Thumbnail + Track Info -->
            <div class="track-left">
                <a id="ytAnchorThumbnail" class="yt-link" href="#" target="_blank" title="Watch on YouTube" style="display: none;">
                    <img id="trackThumbnail" src="" alt="Thumbnail" crossorigin="anonymous">
                </a>
                <div class="track-info">
                    <div class="brand-title">Dora's Music Player</div>
                    <div class="marquee-container">
                        <div class="track-title-wrapper" id="marqueeWrapper">
                            <a id="ytAnchorTitle1" class="track-title" href="#" target="_blank" title="Watch on YouTube">No track loaded</a>
                            <a id="ytAnchorTitle2" class="track-title" href="#" target="_blank" title="Watch on YouTube">No track loaded</a>
                        </div>
                    </div>
                    <div id="trackTimeDisplay" class="track-time">0:00 / 0:00</div>
                </div>
            </div>

            <!-- Controls -->
            <div class="controls">
                <button id="startOverBtn" class="control-btn" title="Start Over">
                    <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                <button id="playPauseBtn" class="control-btn primary" title="Play/Pause">
                    <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                <button id="endSongBtn" class="control-btn" title="End Song">
                    <svg viewBox="0 0 24 24"><path d="M18 18h-2V6h2zM14.5 12L6 6v12z"/></svg>
                </button>
                <button id="loopBtn" class="control-btn" title="Toggle Loop">
                    <svg viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
                </button>
            </div>
        </div>

        <!-- Bottom Progress Seek Bar -->
        <div id="progressBarContainer" class="progress-bar-container" title="Seek">
            <div id="progressBarFill" class="progress-bar-fill"></div>
        </div>
    </div>

    <!-- Input Field & Live History Section -->
    <div id="contentContainer" class="content-container">
        <div class="input-group">
            <input type="text" id="ytInput" placeholder="Paste YouTube link or Video ID...">
            <button id="loadBtn">Play</button>
        </div>
        
        <div class="action-row">
            <button id="embedModalBtn">Get Embed Code</button>
        </div>

        <div class="history-section" id="historySection" style="display: none;">
            <div class="history-header">
                <div class="history-label">Recently Played History</div>
                <button class="clear-history-btn" id="clearHistoryBtn">Clear history</button>
            </div>
            <div class="history-list" id="historyList"></div>
            <button class="history-toggle-btn" id="historyToggleBtn" style="display: none;" onclick="toggleHistoryExpansion()">See all</button>
        </div>
    </div>

    <!-- Dynamic YouTube Player Container Host -->
    <div id="playerContainerHost"></div>

    <script>
        // Custom Alert & Modal Functions
        function showAlert(title, message, isEmbed = false, embedText = '') {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('customAlertMessage').innerText = message;
            const extraContainer = document.getElementById('modalExtraContainer');
            const btnGroup = document.querySelector('.custom-alert-btn-group');
            extraContainer.innerHTML = '';

            if (isEmbed) {
                const textarea = document.createElement('textarea');
                textarea.className = 'custom-alert-textarea';
                textarea.value = embedText;
                textarea.readOnly = true;
                extraContainer.appendChild(textarea);

                btnGroup.innerHTML = `
                    <button id="modalCopyBtn" class="custom-alert-btn">Copy Code</button>
                    <button id="customAlertOkBtn" class="custom-alert-btn secondary">Close</button>
                `;

                document.getElementById('modalCopyBtn').addEventListener('click', () => {
                    textarea.select();
                    textarea.setSelectionRange(0, 99999);
                    try {
                        navigator.clipboard.writeText(textarea.value).then(() => {
                            const copyBtn = document.getElementById('modalCopyBtn');
                            copyBtn.innerText = 'Copied!';
                            setTimeout(() => copyBtn.innerText = 'Copy Code', 2000);
                        });
                    } catch (err) {
                        document.execCommand('copy');
                    }
                });
            } else {
                btnGroup.innerHTML = `<button id="customAlertOkBtn" class="custom-alert-btn">OK</button>`;
            }

            document.getElementById('customAlertOverlay').style.display = 'flex';
            document.getElementById('customAlertOkBtn').addEventListener('click', () => {
                document.getElementById('customAlertOverlay').style.display = 'none';
            }, { once: true });
        }

        const urlParams = new URLSearchParams(window.location.search);
        let videoId = urlParams.get('v');
        const customColor = urlParams.get('c');
        const autoplay = urlParams.get('ap') === '1' ? 1 : 0;
        const volume = parseInt(urlParams.get('vol') || '100', 10);

        let player;
        let isPlaying = false;
        let isLooping = false;
        let progressInterval;
        let currentTitle = '';
        let isHistoryExpanded = false;

        // LocalStorage History Management (Limit 100 tracks)
        function getHistory() {
            try {
                return JSON.parse(localStorage.getItem('dora_music_history') || '[]');
            } catch (e) {
                return [];
            }
        }

        function saveHistory(vid, title) {
            let history = getHistory().filter(item => item.vid !== vid);
            history.unshift({ vid, title: title || `Track (${vid})` });
            if (history.length > 100) history = history.slice(0, 100);
            try {
                localStorage.setItem('dora_music_history', JSON.stringify(history));
            } catch (e) {}
            renderHistoryUI();
        }

        function removeHistoryItem(vid, event) {
            event.stopPropagation(); // Prevent triggering the track click
            let history = getHistory().filter(item => item.vid !== vid);
            try {
                localStorage.setItem('dora_music_history', JSON.stringify(history));
            } catch (e) {}
            renderHistoryUI();
        }

        document.getElementById('clearHistoryBtn').addEventListener('click', () => {
            try {
                localStorage.removeItem('dora_music_history');
            } catch (e) {}
            isHistoryExpanded = false;
            renderHistoryUI();
        });

        function toggleHistoryExpansion() {
            isHistoryExpanded = !isHistoryExpanded;
            renderHistoryUI();
        }

        function renderHistoryUI() {
            const history = getHistory();
            const section = document.getElementById('historySection');
            const list = document.getElementById('historyList');
            const toggleBtn = document.getElementById('historyToggleBtn');
            list.innerHTML = '';

            if (history.length > 0) {
                section.style.display = 'flex';

                // Determine display count based on expansion state
                const displayLimit = isHistoryExpanded ? history.length : 4;
                const visibleHistory = history.slice(0, displayLimit);

                visibleHistory.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'history-item';
                    
                    const spanTitle = document.createElement('span');
                    spanTitle.className = 'history-title-text';
                    spanTitle.innerText = item.title;
                    spanTitle.title = item.title;

                    const removeBtn = document.createElement('button');
                    removeBtn.className = 'history-remove-btn';
                    removeBtn.innerHTML = '&times;';
                    removeBtn.title = 'Remove from history';
                    removeBtn.addEventListener('click', (e) => removeHistoryItem(item.vid, e));

                    div.appendChild(spanTitle);
                    div.appendChild(removeBtn);

                    div.addEventListener('click', () => {
                        videoId = item.vid;
                        initPlayer(item.vid, 1);
                    });
                    list.appendChild(div);
                });

                // Show 'See all' / 'See less' button only if there are more than 4 items
                if (history.length > 4) {
                    toggleBtn.style.display = 'block';
                    toggleBtn.innerText = isHistoryExpanded ? 'See less' : 'See all';
                } else {
                    toggleBtn.style.display = 'none';
                }
            } else {
                section.style.display = 'none';
                isHistoryExpanded = false;
            }
        }

        function extractVideoId(input) {
            input = input.trim();
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = input.match(regExp);
            return (match && match[2].length === 11) ? match[2] : (input.length === 11 ? input : null);
        }

        if (videoId) {
            document.getElementById('contentContainer').style.display = 'none';
            initPlayer(videoId, autoplay);
        } else {
            document.getElementById('contentContainer').style.display = 'flex';
            setTrackTitle('Enter a song below');
            document.getElementById('trackTimeDisplay').innerText = 'Idle';
            renderHistoryUI();
        }

        document.getElementById('loadBtn').addEventListener('click', handleUserSubmit);
        document.getElementById('ytInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleUserSubmit();
        });

        document.getElementById('embedModalBtn').addEventListener('click', () => {
            const currentOrigin = window.location.origin;
            const activeVid = videoId || 'dQw4w9WgXcQ';
            const embedCode = `<div style="width:100%;overflow:hidden;"><iframe allow="autoplay; encrypted-media" src="${currentOrigin}/Dora/?v=${activeVid}&ap=1&vol=100" style="display:block;width:100.5%;height:75px;border:none;margin-left:-0.25%;"></iframe></div>`;
            showAlert('Embed Code', 'Copy the code snippet below to embed this music player seamlessly into your project.', true, embedCode);
        });

        function handleUserSubmit() {
            const val = document.getElementById('ytInput').value;
            const newId = extractVideoId(val);
            if (newId) {
                videoId = newId;
                document.getElementById('ytInput').value = '';
                initPlayer(newId, 1);
            } else {
                showAlert('Notice', 'Please enter a valid YouTube link or 11-character Video ID.');
            }
        }

        function setTrackTitle(text, url = '#') {
            currentTitle = text;
            const t1 = document.getElementById('ytAnchorTitle1');
            const t2 = document.getElementById('ytAnchorTitle2');
            t1.innerText = text;
            t2.innerText = text;
            t1.href = url;
            t2.href = url;
            if (videoId) {
                saveHistory(videoId, text);
            }
        }

        function updateThumbnailAndTheme(vid) {
            const ytUrl = `https://www.youtube.com/watch?v=${vid}`;
            const thumbnailAnchor = document.getElementById('ytAnchorThumbnail');
            thumbnailAnchor.style.display = 'flex';
            thumbnailAnchor.href = ytUrl;
            
            const thumbnailImg = document.getElementById('trackThumbnail');
            thumbnailImg.src = `https://img.youtube.com/vi/${vid}/hqdefault.jpg`;

            thumbnailImg.onload = function() {
                try {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = 50;
                    canvas.height = 50;
                    ctx.drawImage(thumbnailImg, 0, 0, 50, 50);
                    
                    const imgData = ctx.getImageData(0, 0, 50, 50).data;
                    let colors = [];
                    let brightestColor = { r: 255, g: 51, b: 133, score: -1 };

                    for (let i = 0; i < imgData.length; i += 16) {
                        let tr = imgData[i];
                        let tg = imgData[i+1];
                        let tb = imgData[i+2];
                        
                        let brightness = (tr * 299 + tg * 587 + tb * 114) / 1000;
                        let saturationScore = brightness * (Math.max(tr, tg, tb) - Math.min(tr, tg, tb));
                        if (saturationScore > brightestColor.score && brightness > 30 && brightness < 245) {
                            brightestColor = { r: tr, g: tg, b: tb, score: saturationScore };
                        }

                        if (brightness > 20 && brightness < 240) {
                            colors.push({ r: tr, g: tg, b: tb });
                        }
                    }

                    // Brighten and boost ONLY --c1
                    let c1 = `rgb(${brightestColor.r}, ${brightestColor.g}, ${brightestColor.b})`;
                    let brightestBrightness = (brightestColor.r * 299 + brightestColor.g * 587 + brightestColor.b * 114) / 1000;
                    if (brightestBrightness < 90) {
                        let factor = 140 / (brightestBrightness || 1);
                        let br = Math.min(255, Math.floor(brightestColor.r * factor));
                        let bg = Math.min(255, Math.floor(brightestColor.g * factor));
                        let bb = Math.min(255, Math.floor(brightestColor.b * factor));
                        c1 = `rgb(${br}, ${bg}, ${bb})`;
                    }

                    // Check if palette is flat/identical across samples; if so, create structured darkening/shadow offset tiers instead of flat brightening
                    let baseR = brightestColor.r, baseG = brightestColor.g, baseB = brightestColor.b;
                    let sampleCheck = colors.slice(0, 5);
                    let isFlatPalette = sampleCheck.every(col => Math.abs(col.r - baseR) < 15 && Math.abs(col.g - baseG) < 15 && Math.abs(col.b - baseB) < 15);

                    let c2, c3, c4, c5;
                    if (isFlatPalette) {
                        // Automatically generate deep progressive shadow/darkness contrasts for rich depth
                        c2 = `rgb(${Math.max(0, baseR - 30)}, ${Math.max(0, baseG - 30)}, ${Math.max(0, baseB - 30)})`;
                        c3 = `rgb(${Math.max(0, baseR - 60)}, ${Math.max(0, baseG - 60)}, ${Math.max(0, baseB - 60)})`;
                        c4 = `rgb(${Math.max(0, baseR - 90)}, ${Math.max(0, baseG - 90)}, ${Math.max(0, baseB - 90)})`;
                        c5 = `rgb(${Math.max(0, baseR - 120)}, ${Math.max(0, baseG - 120)}, ${Math.max(0, baseB - 120)})`;
                    } else {
                        c2 = colors[Math.floor(colors.length/3)] ? `rgb(${colors[Math.floor(colors.length/3)].r}, ${colors[Math.floor(colors.length/3)].g}, ${colors[Math.floor(colors.length/3)].b})` : `rgb(${Math.max(0, baseR-40)}, ${Math.max(0, baseG-40)}, ${Math.max(0, baseB-40)})`;
                        c3 = colors[Math.floor(colors.length/1.5)] ? `rgb(${colors[Math.floor(colors.length/1.5)].r}, ${colors[Math.floor(colors.length/1.5)].g}, ${colors[Math.floor(colors.length/1.5)].b})` : `rgb(${Math.min(255, baseR+30)}, ${Math.min(255, baseG+10)}, ${Math.min(255, baseB+50)})`;
                        c4 = colors[colors.length-1] ? `rgb(${colors[colors.length-1].r}, ${colors[colors.length-1].g}, ${colors[colors.length-1].b})` : `rgb(${Math.max(0, baseR-70)}, ${Math.max(0, baseG-70)}, ${Math.max(0, baseB-70)})`;
                        c5 = colors[Math.floor(colors.length/4)] ? `rgb(${colors[Math.floor(colors.length/4)].r}, ${colors[Math.floor(colors.length/4)].g}, ${colors[Math.floor(colors.length/4)].b})` : `rgb(20, 20, 25)`;
                    }

                    if (customColor) {
                        c1 = '#' + customColor;
                    }

                    document.documentElement.style.setProperty('--c1', c1);
                    document.documentElement.style.setProperty('--c5', c5);
                    document.documentElement.style.setProperty('--c2', c2);
                    document.documentElement.style.setProperty('--c3', c3);
                    document.documentElement.style.setProperty('--c4', c4);
                } catch (e) {
                    console.log("Using default gradient due to CORS restrictions.");
                }
            };
        }

        function initPlayer(vid, autoPlayState) {
            updateThumbnailAndTheme(vid);

            const oldTarget = document.getElementById('youtube-player');
            if (oldTarget) oldTarget.remove();

            const newTarget = document.createElement('div');
            newTarget.id = 'youtube-player';
            newTarget.style.display = 'none';
            document.body.appendChild(newTarget);

            if (!window.YT || !window.YT.Player) {
                if (!document.getElementById('yt-iframe-api')) {
                    const tag = document.createElement('script');
                    tag.id = 'yt-iframe-api';
                    tag.src = "https://www.youtube.com/iframe_api";
                    const firstScriptTag = document.getElementsByTagName('script')[0];
                    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
                }
                window.onYouTubeIframeAPIReady = function() {
                    createPlayerInstance(vid, autoPlayState);
                };
            } else {
                createPlayerInstance(vid, autoPlayState);
            }
        }

        function createPlayerInstance(vid, autoPlayState) {
            player = new YT.Player('youtube-player', {
                height: '0',
                width: '0',
                videoId: vid,
                playerVars: {
                    'autoplay': autoPlayState,
                    'controls': 0,
                    'disablekb': 1,
                    'fs': 0,
                    'iv_load_policy': 3,
                    'modestbranding': 1,
                    'playsinline': 1
                },
                events: {
                    'onReady': (e) => {
                        e.target.setVolume(volume);
                        if (autoPlayState) e.target.playVideo();
                        updateTrackMetadata();
                    },
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function updateTrackMetadata() {
            try {
                const videoData = player.getVideoData();
                const ytUrl = `https://www.youtube.com/watch?v=${videoId}`;
                if (videoData && videoData.title) {
                    setTrackTitle(videoData.title, ytUrl);
                } else {
                    setTrackTitle(`YouTube Track (${videoId})`, ytUrl);
                }
            } catch (e) {
                setTrackTitle(`YouTube Track (${videoId})`, `https://www.youtube.com/watch?v=${videoId}`);
            }
        }

        function onPlayerStateChange(event) {
            const playIcon = document.getElementById('playIcon');
            const pauseIcon = document.getElementById('pauseIcon');
            const playerWrapper = document.getElementById('playerWrapper');

            if (event.data === YT.PlayerState.PLAYING) {
                isPlaying = true;
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
                playerWrapper.classList.add('playing');
                startProgressTracker();
                updateTrackMetadata();
            } else if (event.data === YT.PlayerState.PAUSED) {
                isPlaying = false;
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
                playerWrapper.classList.remove('playing');
                stopProgressTracker();
            } else if (event.data === YT.PlayerState.ENDED) {
                isPlaying = false;
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
                playerWrapper.classList.remove('playing');
                stopProgressTracker();
                
                if (isLooping) {
                    player.seekTo(0);
                    player.playVideo();
                }
            }
        }

        function startProgressTracker() {
            clearInterval(progressInterval);
            progressInterval = setInterval(() => {
                if (!player || typeof player.getCurrentTime !== 'function') return;
                const currentTime = player.getCurrentTime();
                const duration = player.getDuration();
                
                if (duration > 0) {
                    const percent = (currentTime / duration) * 100;
                    document.getElementById('progressBarFill').style.width = `${percent}%`;
                    document.getElementById('trackTimeDisplay').innerText = `${formatTime(currentTime)} / ${formatTime(duration)}`;
                }
            }, 500);
        }

        function stopProgressTracker() {
            clearInterval(progressInterval);
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        document.getElementById('playPauseBtn').addEventListener('click', () => {
            if (!player) return;
            if (isPlaying) {
                player.pauseVideo();
            } else {
                player.playVideo();
            }
        });

        document.getElementById('startOverBtn').addEventListener('click', () => {
            if (!player) return;
            player.seekTo(0);
            player.playVideo();
        });

        document.getElementById('endSongBtn').addEventListener('click', () => {
            if (!player) return;
            const duration = player.getDuration();
            player.seekTo(duration);
            player.pauseVideo();
            document.getElementById('progressBarFill').style.width = `100%`;
        });

        const loopBtn = document.getElementById('loopBtn');
        loopBtn.addEventListener('click', () => {
            isLooping = !isLooping;
            loopBtn.classList.toggle('active', isLooping);
        });

        const progressBarContainer = document.getElementById('progressBarContainer');
        progressBarContainer.addEventListener('click', (e) => {
            if (!player || typeof player.getDuration !== 'function') return;
            const rect = progressBarContainer.getBoundingClientRect();
            const clickPosition = (e.clientX - rect.left) / rect.width;
            const duration = player.getDuration();
            const seekTarget = clickPosition * duration;
            
            player.seekTo(seekTarget, true);
            document.getElementById('progressBarFill').style.width = `${clickPosition * 100}%`;
        });
    </script>
</body>
</html>
